# Reverse proxy to an app on localhost (Node, Go, a container port bound to 127.0.0.1).

upstream app_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    include snippets/acme-redirect.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;

    include snippets/deny-hidden.conf;

    location / {
        include snippets/rate-limit-general.conf;
        include snippets/proxy-params.conf;
        proxy_pass http://app_backend;
    }

    # Small microcache for a public, read-only endpoint. Remove if every response is per-user.
    location /public/ {
        include snippets/rate-limit-general.conf;
        include snippets/proxy-params.conf;
        proxy_cache PROXYCACHE;
        proxy_cache_valid 200 1m;
        proxy_cache_use_stale error timeout updating http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
        include snippets/security-headers.conf;
        proxy_pass http://app_backend;
    }
}
