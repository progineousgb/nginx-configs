# Laravel. Root is the public/ directory of the current release.

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    include snippets/acme-redirect.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;

    root /var/www/app/current/public;
    index index.php;
    charset utf-8;

    include snippets/deny-hidden.conf;
    include snippets/static-cache.conf;

    location / {
        include snippets/rate-limit-general.conf;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /login {
        include snippets/rate-limit-login.conf;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Only the front controller runs PHP.
    location = /index.php {
        include snippets/fastcgi-php.conf;
        # Resolve the release symlink so OPcache sees the new path after a deploy.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ \.php$ {
        return 404;
    }
}
