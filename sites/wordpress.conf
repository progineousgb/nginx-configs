# WordPress on PHP-FPM with an optional FastCGI page cache.
# Needs conf.d/*.conf in the http context.

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;
    include snippets/acme-redirect.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blog.example.com;

    ssl_certificate /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;

    root /var/www/blog.example.com;
    index index.php;

    include snippets/deny-hidden.conf;
    include snippets/static-cache.conf;

    # Skip the page cache for logged-in users, carts and anything not a plain GET.
    set $skip_cache 0;
    if ($request_method !~ ^(GET|HEAD)$) { set $skip_cache 1; }
    if ($query_string != "") { set $skip_cache 1; }
    if ($request_uri ~* "/wp-admin/|/wp-json/|/xmlrpc.php|wp-.*\.php|/feed/|sitemap(_index)?\.xml") { set $skip_cache 1; }
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in|woocommerce_items_in_cart") { set $skip_cache 1; }

    location / {
        include snippets/rate-limit-general.conf;
        try_files $uri $uri/ /index.php?$args;
    }

    location = /xmlrpc.php {
        deny all;
    }

    location = /wp-login.php {
        include snippets/rate-limit-login.conf;
        include snippets/fastcgi-php.conf;
    }

    # No PHP execution from uploads.
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    location ~* ^/(?:wp-config\.php|readme\.html|license\.txt)$ {
        deny all;
    }

    location ~ \.php$ {
        include snippets/rate-limit-general.conf;
        include snippets/fastcgi-php.conf;

        fastcgi_cache PHPCACHE;
        fastcgi_cache_valid 200 301 10m;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        add_header X-Cache $upstream_cache_status always;
        include snippets/security-headers.conf;
    }
}
