# http context. Loaded by the stock nginx.conf from /etc/nginx/conf.d/.

server_tokens off;

client_max_body_size 64m;
client_body_timeout 15s;
client_header_timeout 15s;
keepalive_timeout 30s;
send_timeout 30s;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/xml application/json application/javascript
           application/rss+xml application/atom+xml image/svg+xml font/ttf font/otf;

# Used by snippets/proxy-params.conf for websocket upgrades.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
