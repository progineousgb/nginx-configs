# Long cache for fingerprinted or rarely changing assets.
location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|ico|gif|jpe?g|png|webp|avif|mp4|webm)$ {
    expires 30d;
    add_header Cache-Control "public" always;
    include snippets/security-headers.conf;
    access_log off;
    try_files $uri =404;
}
