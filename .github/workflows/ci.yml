name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  nginx-t:
    runs-on: ubuntu-latest
    # Ubuntu's nginx is too old for "http2 on;", so use the upstream image.
    container: nginx:stable
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y openssl
      - run: bash test/run.sh
